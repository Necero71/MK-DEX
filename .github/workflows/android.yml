name: Android APK

# APK pipeline: releases (v* tags), manual runs, and native-side changes only.
# Web-only pushes don't trigger it. Need a test APK after a JS change?
# Actions → Android APK → Run workflow.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK check
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          name="${GITHUB_REF_NAME//\//-}"
          [ "$name" = "main" ] && name="dev"
          cp android/app/build/outputs/apk/debug/app-debug.apk "MK-DEX-${name}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MK-DEX-apk
          path: MK-DEX-*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MK-DEX-*.apk
