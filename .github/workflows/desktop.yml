name: Windows EXE

# Desktop pipeline: releases (v* tags), manual runs, and desktop-side changes.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: MK-DEX-windows
          path: desktop/out/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/*.exe
